<div class="relative">
  <!-- Tracking by the burst number re-creates the chest, so its animations start again. -->
  @for (key of burstKeys(); track key.id) {
    <img
      src="/assets/images/icons/chest.webp"
      alt=""
      width="256"
      height="128"
      class="block h-auto w-full"
      [class.animate-chest-bounce]="key.id > 0"
    />
    @if (key.id > 0) {
      <div class="pointer-events-none absolute left-1/2 top-1/3" aria-hidden="true">
        @for (coin of coins; track $index) {
          <img
            src="/assets/images/icons/coin.png"
            alt=""
            width="24"
            height="24"
            class="pixelated animate-coin-burst absolute -ml-3 -mt-3 max-w-none"
            [style.--burst-x]="coin.x"
            [style.--burst-y]="coin.y"
            [style.animation-delay]="coin.delay"
          />
        }
      </div>
    }
  }
</div>

<div class="relative mx-4 mt-3">
  <app-progress-bar [value]="progress()" [label]="label()" tone="gold" />
  @for (marker of markers(); track marker.threshold) {
    <span
      class="absolute top-1/2 flex -translate-x-1/2 -translate-y-1/2"
      [style.left]="marker.left"
    >
      <app-pixel-icon
        [class.animate-star-pop]="marker.reached"
        [name]="marker.reached ? 'star' : 'star-empty'"
      />
    </span>
  }
</div>
