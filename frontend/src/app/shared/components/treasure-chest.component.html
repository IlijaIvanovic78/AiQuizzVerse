<div class="panel px-4 pb-4 pt-2">
  <div class="mb-2 flex items-center justify-between gap-3 whitespace-nowrap">
    <span class="flex items-center gap-2 font-semibold">
      <img
        src="/assets/images/icons/chest.webp"
        alt=""
        width="256"
        height="128"
        class="h-6 w-auto"
      />
      {{ label() }}
    </span>
    <span class="text-sm text-muted">
      <span class="font-display text-parchment-100">{{ correct() }}</span
      >/{{ total() }}
      <span class="sr-only">correct answers</span>
    </span>
  </div>
  <div class="relative mr-3">
    <app-progress-bar [value]="fraction()" [label]="label()" tone="gold" />
    @for (marker of markers(); track marker.accuracy) {
      <span
        class="absolute top-1/2 flex w-max -translate-x-1/2 -translate-y-1/2"
        [style.left.%]="marker.accuracy"
      >
        <app-pixel-icon
          [name]="marker.reached ? 'star' : 'star-empty'"
          [class.animate-star-pop]="marker.reached"
          [label]="marker.reached ? 'Star earned at ' + marker.accuracy + '%' : ''"
        />
      </span>
    }
  </div>
</div>
