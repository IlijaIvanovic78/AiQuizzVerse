<div
  class="fixed inset-0 z-40 flex items-end justify-center bg-night-950/80 p-3 sm:items-center sm:p-6"
  animate.enter="fade-enter"
  (pointerdown)="rememberPressStart($event)"
  (click)="closeOnBackdrop($event)"
>
  <section
    #dialog
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    class="max-h-[90dvh] w-full overflow-y-auto p-5 md:p-6"
    [class]="dialogClass()"
    [attr.aria-labelledby]="titleId"
    animate.enter="modal-enter"
    (keydown.escape)="closeOnEscape($event)"
    (keydown)="keepFocusInside($event)"
  >
    <header class="mb-4 flex items-start justify-between gap-3">
      <h2 class="pt-1 text-2xl" [id]="titleId">{{ title() }}</h2>
      @if (dismissible()) {
        <button
          type="button"
          class="btn btn-ghost btn-sm -mr-2 -mt-1 shrink-0"
          aria-label="Close"
          (click)="closed.emit()"
        >
          <app-pixel-icon name="cross" />
        </button>
      }
    </header>
    <div #body>
      <ng-content />
    </div>
  </section>
</div>
