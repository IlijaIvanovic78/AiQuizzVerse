<nav aria-label="Steps">
  <ol class="flex items-start">
    @for (step of steps(); track step; let index = $index, last = $last) {
      <li class="flex items-start" [class.flex-1]="!last">
        <button
          type="button"
          class="step"
          [class.step-done]="index < currentIndex()"
          [class.step-current]="index === currentIndex()"
          [disabled]="index >= currentIndex()"
          [attr.aria-current]="index === currentIndex() ? 'step' : null"
          (click)="stepChosen.emit(step)"
        >
          <span class="step-number">
            @if (index < currentIndex()) {
              <app-pixel-icon name="check" />
            } @else {
              {{ index + 1 }}
            }
          </span>
          <span class="step-label" [class]="index === currentIndex() ? '' : 'max-sm:sr-only'">
            {{ labels[step] }}
          </span>
        </button>
        @if (!last) {
          <span
            class="step-line"
            [class.step-line-done]="index < currentIndex()"
            aria-hidden="true"
          ></span>
        }
      </li>
    }
  </ol>
</nav>
