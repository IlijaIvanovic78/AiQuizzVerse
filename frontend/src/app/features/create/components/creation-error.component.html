<section class="panel flex flex-col items-center gap-3 p-6 text-center md:p-8" role="alert">
  <img
    src="/assets/images/icons/potion.webp"
    alt=""
    width="256"
    height="148"
    class="animate-pop h-20 w-auto"
  />
  <h2 class="text-2xl md:text-3xl">{{ title() }}</h2>
  <p class="read-text max-w-md">{{ error().message }}</p>
  @if (isConflict()) {
    <p class="max-w-md text-muted">Wait until your other quiz is ready, then try again.</p>
  }
  <div class="mt-3 flex w-full flex-col justify-center gap-3 sm:w-auto sm:flex-row">
    @if (canRetry()) {
      <button type="button" class="btn btn-primary" (click)="retry.emit()">Try again</button>
    }
    <button type="button" class="btn btn-secondary" (click)="back.emit()">
      Back to my choices
    </button>
  </div>
</section>
