<div class="p-6">
  <h2 class="font-pixel text-2xl text-primary-400 mb-6">Join a Game</h2>

  <div class="max-w-md mx-auto bg-dark-800/60 border border-dark-600/30 rounded-xl p-6 space-y-4">
    <p class="font-retro text-sm text-dark-300">Enter the 6-character invite code shared by your friend.</p>

    <div>
      <input
        [(ngModel)]="inviteCode"
        maxlength="6"
        placeholder="Enter code..."
        class="w-full px-4 py-3 rounded-xl bg-dark-900/50 border border-dark-600/30 text-center font-pixel text-2xl tracking-[0.3em] text-primary-300 placeholder-dark-600 focus:outline-none focus:border-primary-500/50 uppercase" />
    </div>

    @if (error$ | async; as error) {
      <div class="p-3 rounded-lg bg-red-500/10 border border-red-500/30">
        <p class="font-retro text-xs text-red-400">{{ error }}</p>
      </div>
    }

    <button (click)="joinMatch()"
      [disabled]="inviteCode.trim().length !== 6 || (loading$ | async)"
      class="w-full py-3 rounded-xl font-pixel text-sm transition-all"
      [class.bg-gradient-to-r]="inviteCode.trim().length === 6"
      [class.from-primary-500]="inviteCode.trim().length === 6"
      [class.to-accent-500]="inviteCode.trim().length === 6"
      [class.text-white]="inviteCode.trim().length === 6"
      [class.bg-dark-700]="inviteCode.trim().length !== 6"
      [class.text-dark-500]="inviteCode.trim().length !== 6"
      [class.cursor-not-allowed]="inviteCode.trim().length !== 6">
      @if (loading$ | async) {
        <span class="flex items-center justify-center gap-2">
          <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          Joining...
        </span>
      } @else {
        🎮 Join Game
      }
    </button>
  </div>
</div>
