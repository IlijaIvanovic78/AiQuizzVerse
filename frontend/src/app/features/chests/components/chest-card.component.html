<article class="panel flex h-full flex-col items-center gap-1 p-3 text-center">
  <div class="mb-1 flex w-full justify-center rounded border-3 border-outline bg-night-950 py-2">
    <app-chest-sprite [type]="chest().type" [scale]="3" />
  </div>
  <h3 class="text-lg leading-tight">{{ name() }}</h3>
  <p class="text-sm leading-tight text-muted">{{ source() }}</p>
  <p class="text-xs text-fog-400">{{ chest().earnedAt | relativeTime }}</p>
  <button
    type="button"
    class="btn btn-primary btn-sm mt-auto w-full"
    [attr.aria-label]="'Open the ' + name().toLowerCase()"
    [disabled]="busy()"
    (click)="open.emit()"
  >
    Open
  </button>
</article>
