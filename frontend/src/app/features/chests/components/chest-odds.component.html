<section class="panel p-4" aria-labelledby="chances-title">
  <h2 id="chances-title" class="text-xl">Chances</h2>
  <p class="text-sm text-muted">Every chest gives one of these. Bigger chests give more.</p>

  @if (odds(); as odds) {
    <div class="mt-3 flex flex-col gap-4">
      @for (type of types; track type) {
        <table class="w-full text-left">
          <caption class="pb-1 text-left font-semibold">
            <span class="inline-flex items-center gap-2">
              <app-pixel-icon [name]="chestIcons[type]" />
              {{ chestNames[type] }}
            </span>
          </caption>
          <thead class="sr-only">
            <tr>
              <th scope="col">Reward</th>
              <th scope="col">Chance</th>
            </tr>
          </thead>
          <tbody>
            @for (row of odds[type]; track row.label) {
              <tr class="border-t-2 border-night-600">
                <td class="py-1 pr-3 text-sm">{{ row.label }}</td>
                <td class="py-1 text-right font-semibold text-torch-300">{{ row.percent }}%</td>
              </tr>
            }
          </tbody>
        </table>
      }
    </div>
  } @else {
    <div class="mt-3">
      <app-spinner label="Counting the chances..." />
    </div>
  }
</section>
