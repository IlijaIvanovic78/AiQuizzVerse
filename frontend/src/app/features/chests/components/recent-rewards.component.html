<section class="panel p-4" aria-labelledby="recent-rewards-title">
  <h2 id="recent-rewards-title" class="text-xl">Recent rewards</h2>
  @if (rows().length > 0) {
    <ul class="mt-3 flex flex-col gap-2">
      @for (row of rows(); track row.chest.id) {
        <li class="flex items-center gap-3 rounded border-2 border-outline bg-night-700 px-3 py-2">
          <app-pixel-icon [name]="chestIcons[row.chest.type]" />
          <span class="min-w-0 flex-1">
            <span class="block font-semibold">{{ row.summary }}</span>
            <span class="flex flex-wrap gap-x-2 text-sm text-muted">
              <span>{{ chestNames[row.chest.type] }}</span>
              @if (row.chest.openedAt; as openedAt) {
                <span>{{ openedAt | relativeTime }}</span>
              }
            </span>
          </span>
        </li>
      }
    </ul>
  } @else {
    <p class="mt-2 text-muted">The chests you open show up here.</p>
  }
</section>
