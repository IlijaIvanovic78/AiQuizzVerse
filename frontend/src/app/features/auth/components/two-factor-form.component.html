<div class="flex flex-col items-center text-center">
  <app-pixel-icon name="lock" [scale]="3" />
  <h1 class="mt-3 text-3xl">Two-step check</h1>
  <p class="mt-2 text-muted">Open your authenticator app and type the code you see there.</p>
</div>

<form class="mt-6 flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
  <app-code-field
    inputId="two-factor-code"
    label="Code"
    [control]="form.controls.code"
    [invalid]="codeInvalid()"
  />

  @if (error()) {
    <p class="form-alert" role="alert">
      <app-pixel-icon name="cross" />
      {{ error() }}
    </p>
  }

  <button type="submit" class="btn btn-primary btn-lg w-full" [disabled]="pending()">
    {{ pending() ? 'Checking...' : 'Verify' }}
  </button>
  <button type="button" class="btn btn-ghost w-full" (click)="back.emit()">Back to login</button>
</form>
