<article class="panel flex h-full flex-col gap-3 p-4">
  <div class="flex items-center gap-3">
    <div
      class="flex h-16 w-16 shrink-0 items-center justify-center rounded border-3 border-outline bg-night-950"
    >
      <app-boost-icon [type]="offer().type" size="md" />
    </div>
    <div class="min-w-0">
      <h3 class="text-xl leading-tight">{{ offer().name }}</h3>
      <span class="badge mt-1" [class.badge-jade]="offer().owned > 0">
        You have {{ offer().owned }}
      </span>
    </div>
  </div>

  <p class="text-fog-200">{{ offer().description }}</p>

  <div class="mt-auto flex flex-wrap items-center justify-between gap-3 pt-1">
    @if (offer().price; as price) {
      <app-coin-amount [amount]="price" />
      <button
        type="button"
        class="btn btn-primary btn-sm"
        [disabled]="busy()"
        (click)="buy.emit(offer())"
      >
        Buy one
      </button>
    } @else {
      <p class="text-sm text-muted">Not for sale in the shop.</p>
      <a routerLink="/paths" class="btn btn-secondary btn-sm">Go to paths</a>
    }
  </div>
</article>
