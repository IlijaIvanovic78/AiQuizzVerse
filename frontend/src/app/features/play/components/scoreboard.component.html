<div class="panel px-3 py-2">
  <ul class="flex items-start gap-2">
    @for (fighter of fighters(); track fighter.id) {
      <li class="flex min-w-0 flex-1 flex-col gap-0.5">
        <span class="max-w-full truncate font-semibold" [class.text-torch-300]="fighter.isMe">
          {{ fighter.isMe ? 'You' : fighter.name }}
        </span>
        <!-- The badge sits next to the points, so a long name still fits on a phone. -->
        <span class="flex flex-wrap items-center gap-x-2 gap-y-1 text-sm text-muted">
          <span
            ><span class="font-display text-gold">{{ fighter.score }}</span> pts</span
          >
          @if (fighter.away) {
            <span class="badge badge-fog">Left</span>
          } @else if (showAnswered() && fighter.answered) {
            <span class="badge badge-jade">
              <app-pixel-icon name="check" [scale]="1" />
              Answered
            </span>
          }
        </span>
      </li>
    }
  </ul>
</div>
