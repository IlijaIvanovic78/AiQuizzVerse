<section class="panel-parchment p-4" aria-labelledby="chests-earned-title">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 id="chests-earned-title" class="text-xl">Chests earned</h2>
    <a class="btn btn-primary btn-sm" routerLink="/chests">Open in the treasure room</a>
  </div>
  <ul class="mt-3 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:gap-x-6">
    @for (chest of chests(); track chest.id) {
      <li class="flex items-center gap-3">
        <app-pixel-icon
          class="animate-star-pop"
          [style.animation-delay.ms]="$index * popDelayMs"
          [name]="chestIcons[chest.type]"
          [scale]="3"
        />
        <span>
          <span class="block font-semibold">{{ chestNames[chest.type] }}</span>
          <span class="block text-sm text-muted">{{ chestSources[chest.source] }}</span>
        </span>
      </li>
    }
  </ul>
</section>
