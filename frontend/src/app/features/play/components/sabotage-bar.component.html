<section class="panel px-3 pb-3 pt-2" aria-labelledby="sabotage-title">
  <div class="mb-2 flex flex-wrap items-center justify-between gap-x-3 text-sm">
    <h3 id="sabotage-title" class="font-semibold text-muted">Sabotage</h3>
    <p class="flex items-center gap-1">
      <app-charge-meter class="gap-1" [charges]="charges()" />
      <span class="ml-1">{{ charges() }} {{ charges() === 1 ? 'charge' : 'charges' }}</span>
    </p>
  </div>

  @if (chosen(); as type) {
    <div class="flex flex-wrap items-center gap-3">
      <app-sabotage-icon [type]="type" />
      <p class="min-w-0 flex-1" role="status">
        <span class="font-semibold">{{ prompt() }}</span>
        <span class="block text-sm text-muted">Tap a glowing player on the scoreboard.</span>
      </p>
      <button type="button" class="btn btn-secondary btn-sm" (click)="cancel.emit()">Cancel</button>
    </div>
  } @else {
    <!-- Phones keep the buttons short; the descriptions are still read out by screen readers. -->
    <ul class="grid grid-cols-3 gap-2">
      @for (type of attacks; track type) {
        @let sabotage = sabotages[type];
        <li>
          <button
            type="button"
            class="btn btn-secondary btn-sm h-full w-full flex-col justify-start gap-1 px-1 py-2"
            [disabled]="!canSabotage()"
            aria-describedby="sabotage-hint"
            (click)="choose.emit(type)"
          >
            <app-sabotage-icon [type]="type" />
            <span>{{ sabotage.label }}</span>
            <span class="sr-only text-xs font-normal leading-tight text-fog-200 sm:not-sr-only">
              {{ sabotage.description }}
            </span>
          </button>
        </li>
      }
    </ul>
    <button
      type="button"
      class="btn btn-secondary btn-sm mt-2 w-full justify-start gap-3 py-2 text-left"
      [disabled]="!canShield()"
      aria-describedby="sabotage-hint"
      (click)="shield.emit()"
    >
      <app-sabotage-icon type="SHIELD" />
      <span class="flex flex-col">
        <span>{{ shielded() ? 'Shield up!' : 'Shield' }}</span>
        <span class="text-xs font-normal leading-tight text-fog-200">
          Blocks the next sabotage aimed at you on this question
        </span>
      </span>
    </button>
    <p id="sabotage-hint" class="mt-2 text-sm text-muted">{{ hint() }}</p>
  }
</section>
