<div class="panel flex items-center gap-3 px-3 py-1.5">
  <span
    class="w-24 shrink-0 text-sm font-semibold"
    [class.text-ruby-400]="warning() || lockedOut()"
    [class.text-jade-400]="locked() && !lockedOut()"
  >
    {{ status() }}
  </span>
  <app-progress-bar class="flex-1" [value]="fraction()" label="Time left" [tone]="tone()" />
  <span
    class="w-12 shrink-0 text-right font-display text-base"
    [class.text-ruby-400]="warning()"
    aria-hidden="true"
  >
    <span class="seconds" [class.seconds-warning]="warning()">{{ seconds() }}</span>
  </span>
  <span class="sr-only">{{ seconds() }} seconds</span>
</div>
