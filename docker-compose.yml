services:
  db:
    image: pgvector/pgvector:pg16
    container_name: quizverse-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizverse}
      POSTGRES_DB: ${POSTGRES_DB:-quizverse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizverse} -d ${POSTGRES_DB:-quizverse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: quizverse-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    env_file: .env
    environment:
      # Inside the compose network the database is reachable as "db", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-quizverse}:${POSTGRES_PASSWORD:-quizverse}@db:5432/${POSTGRES_DB:-quizverse}?schema=public
      BACKEND_PORT: 3000
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: quizverse-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
