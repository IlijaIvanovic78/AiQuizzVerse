services:
  db:
    image: postgres:16-alpine
    container_name: quizverse-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizverse}
      POSTGRES_DB: ${POSTGRES_DB:-quizverse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizverse} -d ${POSTGRES_DB:-quizverse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: quizverse-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reachable as "db", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-quizverse}:${POSTGRES_PASSWORD:-quizverse}@db:5432/${POSTGRES_DB:-quizverse}?schema=public
      BACKEND_PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: quizverse-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    environment:
      API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
